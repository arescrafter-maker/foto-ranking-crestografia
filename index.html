<title>Archivio di stampa — vota le fotografie</title>

<style>
  :root{
    --bg: #E7DFC9;
    --paper: #FBF7EC;
    --ink: #211F1A;
    --pine: #33463A;
    --pine-dim: #4a5f52;
    --rust: #A85C32;
    --muted: #8C8577;
    --line: rgba(33,31,26,0.14);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, rgba(33,31,26,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 32px 16px;
  }
  .stage{ width:100%; max-width: 720px; position: relative; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    display:flex; justify-content: space-between; margin-bottom: 10px;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight: 600; margin: 0 0 6px 0; letter-spacing: -0.01em; }
  .card{
    background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
    box-shadow: 0 1px 0 rgba(33,31,26,0.05), 0 18px 40px -24px rgba(33,31,26,0.35);
    padding: 34px;
  }
  p.lede{ color: var(--pine-dim); font-size: 15px; line-height:1.5; margin: 0 0 22px 0; }
  label.field-label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
  }
  input[type="text"], input[type="password"]{
    width:100%; font-family:'Fraunces', serif; font-size: 22px; padding: 12px 4px;
    border:none; border-bottom: 2px solid var(--ink); background: transparent; color: var(--ink); outline: none;
  }
  input::placeholder{ color: rgba(33,31,26,0.3); }
  .btn{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    padding: 13px 22px; border-radius: 2px; cursor:pointer; transition: transform .12s ease, background .12s ease;
  }
  .btn:hover{ background: var(--pine); border-color: var(--pine); }
  .btn:active{ transform: translateY(1px); }
  .btn.ghost{ background: transparent; color: var(--ink); }
  .btn.ghost:hover{ background: rgba(33,31,26,0.06); }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-row{ display:flex; gap:12px; margin-top: 24px; }
  .btn-row.spread{ justify-content: space-between; }
  .link-btn{
    background:none; border:none; padding:0; font-family:'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-decoration: underline; cursor: pointer;
  }
  .frame-wrap{
    position:relative; border: 1px solid var(--line); background: #1c1a16; aspect-ratio: 3/2;
    display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom: 20px;
  }
  .frame-wrap img{ width:100%; height:100%; object-fit: contain; background:#1c1a16; }
  .frame-wrap .missing{ color:#8C8577; font-family:'IBM Plex Mono',monospace; font-size:12px; text-align:center; padding:20px;}
  .vote-block{ text-align:center; margin: 8px 0 6px 0; }
  .vote-number{
    font-family:'Fraunces', serif; font-weight: 600; font-size: 64px; color: var(--rust);
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  .vote-number span{ font-size: 22px; color: var(--muted); margin-left:4px; }
  input[type="range"]{
    width: 100%; margin: 18px 0 4px 0; -webkit-appearance: none; height: 4px;
    background: var(--line); border-radius: 2px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background: var(--rust);
    border: 3px solid var(--paper); box-shadow: 0 0 0 1px var(--rust); cursor:pointer; margin-top: -7px;
  }
  input[type="range"]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%; background: var(--rust); border: 3px solid var(--paper);
    box-shadow: 0 0 0 1px var(--rust); cursor:pointer;
  }
  .range-ends{ display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); }
  .filmstrip{
    display:flex; gap:6px; overflow-x:auto; padding: 16px 2px 4px 2px; margin-top: 22px;
    border-top: 1px dashed var(--line);
  }
  .filmstrip::-webkit-scrollbar{ height:5px; }
  .filmstrip::-webkit-scrollbar-thumb{ background: var(--line); border-radius:3px; }
  .frame-thumb{
    flex: 0 0 auto; width: 40px; height: 30px; background: #1c1a16 center/cover no-repeat;
    border: 2px solid transparent; border-radius: 2px; cursor: pointer; position: relative; opacity: 0.55;
  }
  .frame-thumb.done{ opacity: 0.85; }
  .frame-thumb.current{ border-color: var(--rust); opacity:1; }
  .frame-thumb .dot{ position:absolute; top:2px; right:2px; width:5px; height:5px; border-radius:50%; background: var(--pine); }
  .review-row{ display:flex; align-items:center; gap:14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .review-row:last-child{ border-bottom:none; }
  .review-thumb{ width:64px; height:48px; object-fit:cover; background:#1c1a16; border-radius:2px; flex-shrink:0; }
  .review-info{ flex:1; min-width:0; }
  .review-title{ font-family:'Fraunces',serif; font-size:15px; }
  .review-score{ font-family:'IBM Plex Mono',monospace; font-size:20px; color:var(--rust); width:44px; text-align:right; }
  .review-edit-btn{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--muted); background:none; border:1px solid var(--line); border-radius:2px; padding:6px 10px; cursor:pointer;
  }
  .review-edit-btn:hover{ border-color: var(--ink); color: var(--ink); }
  .inline-editor{ width:100%; margin-top:10px; }
  .banner{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.05em; color: var(--pine);
    background: rgba(51,70,58,0.08); border:1px solid rgba(51,70,58,0.25); padding:10px 14px; border-radius:2px; margin-bottom:18px;
  }
  .banner.error{ color:#8a3324; background: rgba(168,92,50,0.1); border-color: rgba(168,92,50,0.35); }
  table.stats{ width:100%; border-collapse: collapse; font-size: 14px; }
  table.stats th{
    font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.08em;
    color: var(--muted); text-align:left; border-bottom: 1px solid var(--ink); padding: 6px 8px;
  }
  table.stats td{ padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle;}
  table.stats img{ width:56px; height:40px; object-fit:cover; border-radius:2px; }
  .rank-num{ font-family:'Fraunces',serif; font-size:18px; color: var(--rust); width: 30px; }
  .voters-list{ font-family:'IBM Plex Mono',monospace; font-size:10px; color: var(--muted); }
  textarea.csv{
    width:100%; height:140px; font-family:'IBM Plex Mono',monospace; font-size:11px;
    background: #1c1a16; color: #E7DFC9; border:none; border-radius:2px; padding:12px; margin-top:12px;
  }
  .footer-note{ margin-top:18px; font-size:12px; color:var(--muted); }
  .modal-overlay{
    position:fixed; inset:0; background: rgba(33,31,26,0.55);
    display:flex; align-items:center; justify-content:center; z-index: 50; padding: 16px;
  }
  .modal-card{
    background: var(--paper); border-radius:4px; padding: 28px; width:100%; max-width: 360px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.5);
  }
</style>

const stage = document.getElementById('stage');
let state = { screen: 'start', name: '', slug: '', scores: {}, index: 0, completed: false };

function slugify(name){
  return name.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,'-')
    .replace(/[^a-z0-9\-]/g,'')
    .slice(0, 60) || 'anonimo';
}

async function loadVoter(name){
  const slug = slugify(name);
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/voters/${slug}.json`);
    const data = await res.json();
    return { slug, data };
  }catch(e){
    console.error('Errore caricamento', e);
    return { slug, data: null };
  }
}

async function saveVoter(slug, payload){
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/voters/${slug}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    return res.ok;
  }catch(e){
    console.error('Errore salvataggio', e);
    return false;
  }
}

async function loadAllVoters(){
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/voters.json`);
    const data = await res.json();
    return data ? Object.values(data) : [];
  }catch(e){
    console.error('Errore caricamento statistiche', e);
    return null; // null = errore, [] = nessun dato
  }
}

function render(){
  if(state.screen === 'start') return renderStart();
  if(state.screen === 'voting') return renderVoting();
  if(state.screen === 'review') return renderReview();
  if(state.screen === 'done') return renderDone();
  if(state.screen === 'admin-gate') return renderAdminGate();
  if(state.screen === 'admin') return renderAdmin();
}

function renderStart(){
  stage.innerHTML = `
    <div class="eyebrow"><span>Archivio di stampa</span><span>Nº ${String(PHOTOS.length).padStart(3,'0')} scatti</span></div>
    <div class="card">
      <h1>Vota le fotografie</h1>
      <p class="lede">Scrivi il tuo nome, poi ti verranno mostrate ${PHOTOS.length} fotografie una alla volta.
      Per ognuna darai un voto da 0 a 100. Alla fine potrai rivedere e correggere tutti i tuoi voti prima di confermarli — e potrai tornare a modificarli anche più avanti.</p>
      <label class="field-label">Il tuo nome</label>
      <input type="text" id="nameInput" placeholder="es. Luigi (o Luigi Rossi se conosci più Luigi)" autocomplete="off">
      <div class="btn-row">
        <button class="btn" id="startBtn">Inizia a votare</button>
        <button class="link-btn" id="adminLink" style="margin-left:auto; align-self:center;">Sono io — statistiche</button>
      </div>
    </div>
  `;
  document.getElementById('startBtn').onclick = onStart;
  document.getElementById('nameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') onStart(); });
  document.getElementById('adminLink').onclick = () => { state.screen = 'admin-gate'; render(); };
}

function renderAdminGate(){
  stage.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal-card">
        <h3>Statistiche</h3>
        <p class="lede" style="margin-bottom:14px;">Inserisci la password.</p>
        <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
        <div class="btn-row">
          <button class="btn ghost" id="cancelPw">Annulla</button>
          <button class="btn" id="confirmPw">Entra</button>
        </div>
        <div id="pwError" style="display:none; margin-top:12px;" class="banner error">Password errata.</div>
      </div>
    </div>
  `;
  document.getElementById('cancelPw').onclick = () => { state.screen = 'start'; render(); };
  const submit = () => {
    const val = document.getElementById('pwInput').value;
    if(val === ADMIN_PASSWORD){ state.screen = 'admin'; render(); }
    else { document.getElementById('pwError').style.display = 'block'; }
  };
  document.getElementById('confirmPw').onclick = submit;
  document.getElementById('pwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  document.getElementById('pwInput').focus();
}

async function onStart(){
  const val = document.getElementById('nameInput').value.trim();
  if(!val){ document.getElementById('nameInput').focus(); return; }
  const startBtn = document.getElementById('startBtn');
  startBtn.disabled = true; startBtn.textContent = 'Un attimo…';
  const { slug, data } = await loadVoter(val);
  state.name = data ? data.name : val;
  state.slug = slug;
  state.scores = data ? (data.scores || {}) : {};
  state.completed = data ? !!data.completed : false;
  if(state.completed){
    state.screen = 'review';
  } else {
    let firstUnvoted = PHOTOS.findIndex(p => state.scores[p.id] === undefined);
    state.index = firstUnvoted === -1 ? 0 : firstUnvoted;
    state.screen = 'voting';
  }
  render();
}

function currentScore(photoId){
  return state.scores[photoId] !== undefined ? state.scores[photoId] : 50;
}

function renderVoting(){
  const photo = PHOTOS[state.index];
  const score = currentScore(photo.id);
  const isLast = state.index === PHOTOS.length - 1;

  stage.innerHTML = `
    <div class="eyebrow">
      <span>${escapeHtml(state.name)}</span>
      <span>Nº ${String(state.index+1).padStart(3,'0')} / ${String(PHOTOS.length).padStart(3,'0')}</span>
    </div>
    <div class="card">
      <div class="frame-wrap">
        ${photo.url ? `<img src="${photo.url}" alt="${escapeHtml(photo.title)}" onerror="this.style.display='none'; this.parentElement.innerHTML+='<div class=missing>Immagine non disponibile —<br>controlla il nome del file.</div>'">` : `<div class="missing">Nessun link impostato per questa foto.</div>`}
      </div>
      <div class="vote-block"><div class="vote-number" id="voteNum">${score}<span>/100</span></div></div>
      <input type="range" min="0" max="100" step="1" value="${score}" id="rangeInput">
      <div class="range-ends"><span>0</span><span>100</span></div>
      <div class="btn-row spread">
        <button class="btn ghost" id="backBtn" ${state.index===0 ? 'disabled':''}>← Indietro</button>
        <button class="btn" id="nextBtn">${isLast ? 'Vai alla revisione →' : 'Avanti →'}</button>
      </div>
      <div class="filmstrip" id="filmstrip"></div>
    </div>
  `;

  const range = document.getElementById('rangeInput');
  const voteNum = document.getElementById('voteNum');
  range.addEventListener('input', () => { voteNum.innerHTML = range.value + '<span>/100</span>'; });

  document.getElementById('backBtn').onclick = async () => {
    state.scores[photo.id] = parseInt(range.value, 10);
    await saveVoter(state.slug, { name: state.name, scores: state.scores, completed: false, updatedAt: new Date().toISOString() });
    state.index = Math.max(0, state.index - 1);
    render();
  };
  document.getElementById('nextBtn').onclick = async () => {
    state.scores[photo.id] = parseInt(range.value, 10);
    await saveVoter(state.slug, { name: state.name, scores: state.scores, completed: false, updatedAt: new Date().toISOString() });
    if(isLast){ state.screen = 'review'; } else { state.index++; }
    render();
  };

  const filmstrip = document.getElementById('filmstrip');
  filmstrip.innerHTML = PHOTOS.map((p,i)=>{
    const cls = ['frame-thumb'];
    if(i===state.index) cls.push('current');
    if(state.scores[p.id] !== undefined) cls.push('done');
    return `<div class="${cls.join(' ')}" style="background-image:url('${p.url}')" data-i="${i}">${state.scores[p.id]!==undefined?'<div class="dot"></div>':''}</div>`;
  }).join('');
  filmstrip.querySelectorAll('.frame-thumb').forEach(el=>{
    el.onclick = async () => {
      state.scores[photo.id] = parseInt(range.value, 10);
      await saveVoter(state.slug, { name: state.name, scores: state.scores, completed: false, updatedAt: new Date().toISOString() });
      state.index = parseInt(el.dataset.i, 10);
      render();
    };
  });
}

function renderReview(){
  stage.innerHTML = `
    <div class="eyebrow"><span>${escapeHtml(state.name)}</span><span>Revisione voti</span></div>
    <div class="card">
      <h2>Rivedi i tuoi voti</h2>
      <p class="lede">${state.completed ? 'Hai già confermato i tuoi voti. Puoi comunque modificarli qui sotto in qualsiasi momento.' : 'Controlla i voti dati a ogni fotografia. Puoi correggerli prima di confermare.'}</p>
      <div id="reviewList"></div>
      <div class="btn-row spread">
        <button class="btn ghost" id="backToVoting">← Torna alle foto</button>
        <button class="btn" id="confirmBtn">${state.completed ? 'Salva modifiche' : 'Conferma tutti i voti'}</button>
      </div>
    </div>
  `;
  const list = document.getElementById('reviewList');
  list.innerHTML = PHOTOS.map(p => `
    <div class="review-row" data-id="${p.id}">
      <img class="review-thumb" src="${p.url}" alt="">
      <div class="review-info">
        <div class="review-title">${escapeHtml(p.title)}</div>
        <div class="editor-slot"></div>
      </div>
      <div class="review-score">${currentScore(p.id)}</div>
      <button class="review-edit-btn" data-id="${p.id}">Modifica</button>
    </div>
  `).join('');

  list.querySelectorAll('.review-edit-btn').forEach(btn=>{
    btn.onclick = () => {
      const row = btn.closest('.review-row');
      const id = btn.dataset.id;
      const slot = row.querySelector('.editor-slot');
      if(slot.innerHTML){ slot.innerHTML=''; return; }
      const val = currentScore(id);
      slot.innerHTML = `<input type="range" min="0" max="100" step="1" value="${val}" class="inline-editor" data-id="${id}">`;
      const rangeEl = slot.querySelector('input');
      const scoreLabel = row.querySelector('.review-score');
      rangeEl.addEventListener('input', ()=>{ scoreLabel.textContent = rangeEl.value; });
      rangeEl.addEventListener('change', ()=>{ state.scores[id] = parseInt(rangeEl.value,10); });
    };
  });

  document.getElementById('backToVoting').onclick = () => { state.screen = 'voting'; state.index = 0; render(); };
  document.getElementById('confirmBtn').onclick = async () => {
    list.querySelectorAll('.inline-editor').forEach(r => { state.scores[r.dataset.id] = parseInt(r.value,10); });
    const confirmBtn = document.getElementById('confirmBtn');
    confirmBtn.disabled = true; confirmBtn.textContent = 'Salvataggio…';
    state.completed = true;
    const ok = await saveVoter(state.slug, { name: state.name, scores: state.scores, completed: true, updatedAt: new Date().toISOString() });
    if(ok){ state.screen = 'done'; render(); }
    else {
      confirmBtn.disabled = false; confirmBtn.textContent = 'Riprova';
      alert('Non sono riuscito a salvare, controlla la connessione e riprova.');
    }
  };
}

function renderDone(){
  stage.innerHTML = `
    <div class="eyebrow"><span>${escapeHtml(state.name)}</span><span>Fatto</span></div>
    <div class="card">
      <div class="banner">Voti salvati. Grazie ${escapeHtml(state.name)}!</div>
      <h2>Hai votato tutte le fotografie</h2>
      <p class="lede">Puoi chiudere questa pagina, oppure tornare a rivedere o correggere i tuoi voti quando vuoi.</p>
      <div class="btn-row">
        <button class="btn ghost" id="reviewAgain">Rivedi i miei voti</button>
        <button class="btn" id="restartBtn">Torna all'inizio</button>
      </div>
    </div>
  `;
  document.getElementById('reviewAgain').onclick = () => { state.screen='review'; render(); };
  document.getElementById('restartBtn').onclick = () => { state = { screen:'start', name:'', slug:'', scores:{}, index:0, completed:false }; render(); };
}

async function renderAdmin(){
  stage.innerHTML = `
    <div class="eyebrow"><span>Statistiche</span><span>solo per te</span></div>
    <div class="card"><p class="lede">Caricamento voti in corso…</p></div>
  `;
  const voters = await loadAllVoters();

  if(voters === null){
    stage.innerHTML = `
      <div class="eyebrow"><span>Statistiche</span><span>errore</span></div>
      <div class="card">
        <div class="banner error">Non sono riuscito a leggere i dati. Controlla la connessione o le regole del database Firebase.</div>
        <button class="btn ghost" id="backHome">← Torna all'inizio</button>
      </div>
    `;
    document.getElementById('backHome').onclick = () => { state.screen='start'; render(); };
    return;
  }

  const perPhoto = {};
  PHOTOS.forEach(p => perPhoto[p.id] = { photo: p, scores: [], voters: [] });
  voters.forEach(v => {
    PHOTOS.forEach(p => {
      if(v.scores && v.scores[p.id] !== undefined){
        perPhoto[p.id].scores.push(v.scores[p.id]);
        perPhoto[p.id].voters.push(`${v.name}: ${v.scores[p.id]}`);
      }
    });
  });

  const ranking = PHOTOS.map(p => {
    const entry = perPhoto[p.id];
    const n = entry.scores.length;
    const avg = n ? (entry.scores.reduce((a,b)=>a+b,0)/n) : null;
    return { photo: p, avg, n, voters: entry.voters };
  }).sort((a,b) => (b.avg ?? -1) - (a.avg ?? -1));

  const completedCount = voters.filter(v=>v.completed).length;

  const rows = ranking.map((r,i) => `
    <tr>
      <td class="rank-num">${i+1}</td>
      <td><img src="${r.photo.url}" alt=""></td>
      <td>${escapeHtml(r.photo.title)}</td>
      <td><strong>${r.avg !== null ? r.avg.toFixed(1) : '—'}</strong></td>
      <td>${r.n}</td>
      <td class="voters-list">${r.voters.join(' · ') || '—'}</td>
    </tr>
  `).join('');

  const csv = ['nome,foto_id,foto_titolo,voto'].concat(
    voters.flatMap(v => PHOTOS.filter(p=>v.scores && v.scores[p.id]!==undefined)
      .map(p => `${v.name},${p.id},${p.title.replace(/,/g,' ')},${v.scores[p.id]}`))
  ).join('\n');

  stage.innerHTML = `
    <div class="eyebrow"><span>Statistiche</span><span>${voters.length} persone · ${completedCount} hanno confermato</span></div>
    <div class="card">
      <h2>Classifica delle tue fotografie</h2>
      <p class="lede">Media dei voti ricevuti da ${voters.length} persone (${completedCount} hanno confermato tutti i voti, gli altri sono ancora in corso).</p>
      <div style="overflow-x:auto;">
        <table class="stats">
          <thead><tr><th>#</th><th></th><th>Foto</th><th>Media</th><th>Voti</th><th>Dettaglio</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6">Ancora nessun voto registrato.</td></tr>'}</tbody>
        </table>
      </div>
      <p class="footer-note">Esporta i dati grezzi in CSV (copia e incolla in un foglio di calcolo):</p>
      <textarea class="csv" readonly onclick="this.select()">${csv}</textarea>
      <div class="btn-row">
        <button class="btn ghost" id="backHome">← Torna all'inizio</button>
      </div>
    </div>
  `;
  document.getElementById('backHome').onclick = () => { state.screen='start'; render(); };
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

render();
</script>
</body>
</html>
